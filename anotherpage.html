<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мишка и я</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #2c462a, #f4cd40);
      font-family: Georgia, sans-serif;
      color: #fff;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    h1 {
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
    }
  </style>
</head>
 <style>
  .blur-edges {
    position: relative;
      width: 1200px; /* можно изменить под размер фото */
      overflow: hidden;
    }
  .blur-edges img {
      width: 100%;
      height: auto;
      display: block;
       /* маска для плавного исчезновения краёв */
      -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 0) 70%, rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: cover;
      mask-size:

      /* чуть размываем края для мягкости */

      div {
  /* Размытие */
  backdrop-filter: blur(60px); /* если нужно размыть фон за элементом */
  
  /* Масштабирование */
  transform: scale(1.03);
  
  /* Для плавного эффекта */
  transition: transform 0.3s ease, filter 0.3s ease;
      }
    }
      
    @media (max-width: 768px) {
      body {
        font-size: 16px;
        padding: 0 10px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 15px;
      }


      p {
        font-size: 16px;
      }

      .blur-edges img {
        transform: scale(1.02);
      }

    }

    @media (max-width: 480px) {
      h1 {
        font-size: 30px;
      }

      p {
        font-size: 20px;
      }

      .blur-edges img {
        transform: scale(1.0);
      }
    }
 </style>

</body>
<body>
  <div class="blur-edges">
    <img src="assets/images/obnimau2.png" alt="Фото">
  </div>
</body>
<body>
  
  <h1>Это мы в Краснодаре!</h1>
  <p>✨ОБНИМАЕМСЯ✨</p>

  <script>
    window.onload = () => {
      document.body.style.opacity = 1;
    };
  </script>
</body>
</html>
